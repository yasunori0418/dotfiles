# Tirith security policy
# Documentation: https://tirith.dev/docs/policy

# Fail mode: "open" (allow on error) or "closed" (block on error)
fail_mode: open

# Paranoia level (1-4): higher = more sensitive detection
paranoia: 1

# Allow TIRITH=0 bypass in interactive terminals
allow_bypass_env: true

# Require explicit acknowledgement for warn findings in interactive mode
strict_warn: false

# Severity overrides per rule (e.g., shortened_url: LOW)
severity_overrides:
  # 日本語の句点「。」(U+3002) が ASCII の '.' と混同判定される false positive を
  # 抑制する。日本語コミットメッセージや日本語コメントを含む Bash が常に HIGH で
  # deny されてしまうため。paranoia: 1（Medium+ のみ有効）に対して LOW へ落とすと
  # 検出結果からは隠れ、hook もブロックしなくなる。
  # 誤検知の再現: `tirith policy test --file <日本語文の混じった shell スクリプト>`。
  confusable_text: LOW

  # ブロックされた rm も file_delete イベントとして計上されるため、20 秒以内に
  # 再試行すると自分のブロック記録が相関窓を延命させ、再びブロックされる。
  # tmp_claude/ のような作業用一時ディレクトリの掃除で 20 秒内に 3 発以上 rm を
  # 撃つと恒常的に踏む。paranoia: 1（Medium+ のみ有効）に対して LOW へ落として
  # 無効化する。暴走した再帰削除の検知は失うが、破壊的操作の主防壁は git と
  # バックアップ側に置く方針。
  # 誤検知の再現: 20 秒内に別ファイルへ rm を 3 回発行し、直後にもう 1 回撃つ。
  # 一時回避（policy を変えない場合）: 20 秒待つか TIRITH=0 を前置する。
  mass_file_deletion: LOW

# URL patterns to always allow
allowlist: []

# URL patterns to always block (overrides allowlist)
blocklist: []

# Force specific rules to block (upgrade only, cannot downgrade)
# action_overrides:
#   shortened_url: block

# Escalation: upgrade warnings to blocks based on session history
# escalation:
#   - trigger: repeat_count    # block after N warnings for the same rule
#     rule_ids: ["*"]          # "*" = any rule, or list specific rule IDs
#     threshold: 5
#     window_minutes: 60
#     action: block
#   - trigger: multi_medium    # block when N+ medium findings on one command
#     min_findings: 3
#     action: block

# Glob patterns to ignore during scan
scan:
  ignore_patterns: []
