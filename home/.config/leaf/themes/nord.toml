# Nord theme (https://www.nordtheme.com/docs/colors-and-palettes)
#   Polar Night: nord0 #2e3440  nord1 #3b4252  nord2 #434c5e  nord3 #4c566a
#   Snow Storm:  nord4 #d8dee9  nord5 #e5e9f0  nord6 #eceff4
#   Frost:       nord7 #8fbcbb  nord8 #88c0d0  nord9 #81a1c1  nord10 #5e81ac
#   Aurora:      nord11 #bf616a nord12 #d08770 nord13 #ebcb8b nord14 #a3be8c nord15 #b48ead
# Diff / mark backgrounds are blends of an Aurora/Frost color over nord0.
base = "ocean"
syntax = "base16-ocean.dark"

[ui]
toc_bg = "#3b4252"
toc_border = "#4c566a"
content_bg = "#2e3440"
scrollbar_hover = "#88c0d0"
status_bg = "#3b4252"
status_separator = "#4c566a"
status_brand_fg = "#2e3440"
status_brand_bg = "#88c0d0"
status_filename_fg = "#eceff4"
status_filename_bg = "#434c5e"
status_watch_fg = "#a3be8c"
status_watch_bg = "#45504f"
status_reloaded_fg = "#2e3440"
status_reloaded_bg = "#a3be8c"
status_search_fg = "#ebcb8b"
status_search_bg = "#434c5e"
status_success_fg = "#a3be8c"
status_success_bg = "#45504f"
status_warning_fg = "#ebcb8b"
status_error_fg = "#bf616a"
status_error_bg = "#4b3d48"
status_shortcut_fg = "#d8dee9"
status_percent_fg = "#88c0d0"
status_dot_fg = "#4c566a"
toc_hover_fg = "#eceff4"
toc_header_fg = "#81a1c1"
toc_active_bg = "#434c5e"
toc_inactive_bg = "#3b4252"
toc_accent = "#88c0d0"
toc_index_inactive = "#4c566a"
toc_primary_active = "#eceff4"
toc_primary_inactive = "#d8dee9"
toc_secondary_inactive = "#4c566a"
toc_secondary_text_active = "#e5e9f0"
toc_secondary_text_inactive = "#81a1c1"

