PreToolUse:
  - matcher: "Edit|Write|NotebookEdit"
    actions:
      - type: command
        command: $HOME/.claude/hooks/task-boundary/main.sh
        use_stdin: true
  # AskUserQuestion をセッション単位で無効化する。remote-control 経由のスマホ/web
  # セッションでは、質問文・選択肢の文脈が選択UIの前に表示されない挙動があるため、
  # そのセッションだけテキスト質問へ倒す。判定は guard スクリプトが stdin の
  # session_id からマーカー /tmp/claude-no-askuserquestion.<session_id> を探し、
  # 有れば deny・無ければ沈黙（通常進行）する。マーカーの作成/削除は下記
  # UserPromptSubmit のトグル（プロンプトに #aq-off / #aq-on）が行う。
  # 従来の PC 全体マーカー（/tmp/claude-no-askuserquestion）は廃止。/tmp なので
  # 再起動でマーカーが消え既定（有効）へ復帰する。
  - matcher: "AskUserQuestion"
    actions:
      - type: command
        command: $HOME/.claude/hooks/askuserquestion-guard/main.sh
        use_stdin: true
      # AskUserQuestion 発火時にデスクトップ通知（remote-control 経由などで選択 UI に
      # 気づかず回答が遅れるのを防ぐ）。notify 側で #aq-off マーカーを見て自己抑制する
      # ので guard との順序依存はない。use_stdin 必須（main.sh は stdin から JSON を読む）。
      - type: command
        command: $HOME/.claude/hooks/askuserquestion-notify/main.sh
        use_stdin: true
  - matcher: "WebFetch"
    conditions:
      - type: url_starts_with
        value: "https://github.com"
    actions:
      - type: output
        message: "WebFetchではなく、`gh`コマンド経由で情報を取得"
  # git rebase / git reset は全面禁止からスキル経由の許可制に変更。
  # rebase-flow / reset-flow スキルの arm スクリプトが .git 内に置く解錠 marker
  # （30 分有効）を git-guard が検証し、無ければ deny、あれば意見なし。
  # 意見なしの場合は settings.json の ask（`Bash(git rebase:*)` / `Bash(git reset:*)`）
  # に落ちるため、スキル経由でも実行直前にユーザー確認が入る（多層防御）。
  # コマンド全文の部分一致で拾うのは従来どおり（auto モード + 複合コマンドで
  # settings ルールが LLM 分類器にフォールバックして取りこぼす事故対策）。
  - matcher: "Bash"
    conditions:
      - type: command_contains
        value: "git rebase"
    actions:
      - type: command
        command: $HOME/.claude/hooks/git-guard/main.sh rebase
        use_stdin: true
  - matcher: "Bash"
    conditions:
      - type: command_contains
        value: "pull --rebase"
    actions:
      - type: command
        command: $HOME/.claude/hooks/git-guard/main.sh rebase
        use_stdin: true
  - matcher: "Bash"
    conditions:
      - type: command_contains
        value: "git pull -r"
    actions:
      - type: command
        command: $HOME/.claude/hooks/git-guard/main.sh rebase
        use_stdin: true
  - matcher: "Bash"
    conditions:
      - type: command_contains
        value: "git reset"
    actions:
      - type: command
        command: $HOME/.claude/hooks/git-guard/main.sh reset
        use_stdin: true
  # raw の force push は禁止（gh-push スキル経由に限定。保護ブランチ拒否・明示 lease
  # を script 側で強制するため）。通常 push は意見なし → settings の ask へ。
  - matcher: "Bash"
    conditions:
      - type: command_contains
        value: "git push"
    actions:
      - type: command
        command: $HOME/.claude/hooks/git-guard/main.sh push
        use_stdin: true
  - matcher: "Bash"
    actions:
      - type: command
        command: $HOME/.claude/hooks/sudo-guard/main.sh
        use_stdin: true
  # zsh の noclobber（Bash ツールは profile 由来の zsh で eval される）により、
  # 既存ファイルへの `>` は上書きされず `zsh: file exists:` で失敗する。
  # 静的に解決でき かつ実在するファイルへの上書きだけを deny し `>|` へ誘導する
  # （解決できない書き先には沈黙）。ループ内リダイレクトは exit code 0 のまま
  # 2 周目以降が全滅するため、事前 deny でしか防げない。
  # condition で `>` を含むコマンドだけに絞り、無関係な Bash の起動コストを避ける。
  - matcher: "Bash"
    conditions:
      - type: command_contains
        value: ">"
    actions:
      - type: command
        command: $HOME/.claude/hooks/noclobber-guard/main.sh
        use_stdin: true
  # tirith による Bash コマンド走査（URL の homograph 検査・pipe-to-shell 検知など）。
  # tirith リポジトリ配布の tirith-check.py を nput で symlink 配置しており、
  # 依存パッケージは標準ライブラリのみ。uv 経由で python バージョンを 3.13 に固定
  # （システム python の差異で挙動が変わらないようにする）。
  - matcher: "Bash"
    actions:
      - type: command
        command: uv run --python 3.13 -- $HOME/.claude/hooks/tirith/tirith-check.py
        use_stdin: true

PostToolUse:

PermissionRequest:

Notification:

UserPromptSubmit:
  # AskUserQuestion 無効化トグル: プロンプトに #aq-off / #aq-on を含めると、その
  # セッションのマーカー（/tmp/claude-no-askuserquestion.<session_id>）を作成/削除する。
  # セッション単位なので同一 PC・同一プロジェクトの並行セッションには影響しない。
  - actions:
      - type: command
        command: $HOME/.claude/hooks/askuserquestion-toggle/main.sh
        use_stdin: true

Stop:
  - actions:
      - type: command
        command: $HOME/.claude/hooks/notify-stop/main.sh
        use_stdin: true
  # 並列エージェント(agent teams)の滞留防止。stdin の background_tasks から
  # type が subagent / teammate のものを抽出し、残っていれば decision: "block" +
  # reason で TaskStop を促す。idle_notification は「終了」ではなく「空いて待機中」
  # の意味で、明示的に止めない限り滞留し続けるため(実測で 1 セッション 18 体)。
  # 出力は decision/reason 形式。cchook は Stop の hookSpecificOutput を
  # "not supported" として握り潰すため additionalContext 形式は使えない。
  # 残留が無ければ沈黙。stop_hook_active では自己抑制するので空転しない。
  - actions:
      - type: command
        command: $HOME/.claude/hooks/teammate-leak-guard/main.sh
        use_stdin: true
  # 捏造ツール呼び出しの検出。ツールを実行していないのに実行したかのように
  # 応答する現象を Stop 時に捕まえ、decision: "block" + reason で未検証の記述を
  # 洗い直させる。transcript を末尾から遡って今回のターンだけを走査するので
  # use_stdin 必須(transcript_path を読む)。独立した 2 チェックを持つ。
  #   1. XML 混入型 — ツール呼び出しの XML が text ブロックへ平文として書かれ、
  #      実行結果まで作り話になる(self-rollout)。あらゆるツールが対象。
  #      コードフェンス・インラインコード除去後にマッチするため、現象を
  #      引用・言及しただけのテキストでは発火しない。
  #   2. 未実行完了主張型 — XML の痕跡を残さず「作成しました」とだけ報告し、
  #      そのターンに Write/Edit が無い。主張パスの実在確認まで行う。
  # このマシンの全 561 セッション走査では、1 が 4 セッション 10 件で実発生、
  # 2 は 0 件。最終ターンへ適用した場合の誤検出は 0 件。検出無しなら沈黙。
  # ただし XML を伴わない Bash 実行の捏造(「ビルドを開始しました」等)や
  # 調査結果の捏造は依然として検出できない部分対策であり、
  # 沈黙は捏造が無かったことの保証にはならない。
  - actions:
      - type: command
        command: $HOME/.claude/hooks/fabricated-toolcall-guard/main.sh
        use_stdin: true

SubagentStart:

SubagentStop:

PreCompact:
  - matcher: "auto"
    actions:
      - type: output
        message: "直前の作業内容と最初の依頼内容は圧縮しないこと。過去の作業途中の内容を圧縮"

SessionStart:
  # herdr（コーディングエージェント用ターミナルマルチプレクサ）へ、この pane で
  # 動いている Claude セッションの session_id / transcript_path を報告する。
  # herdr 側の integration インストーラは settings.json へ直接 hook を書き込むが、
  # hook 定義は cchook へ集約する方針なのでこちらに置く（settings.json は
  # claudeSettings.nix が SSOT で、recopy すると herdr の書き込みは消える）。
  # スクリプトは stdin の hook JSON から session_id を読むため use_stdin 必須。
  # HERDR_ENV / HERDR_SOCKET_PATH / HERDR_PANE_ID が無ければ自己抑制して終了する。
  # 実体は nput 配置（nputFileMap.nix の herdrEntries、flake input `herdr`）で、
  # herdr リポジトリ側のアセットに実行ビットが無い（store 上で -r--r--r--）ため
  # 直接起動すると exit 126 になる。herdr 純正の settings.json 定義と同様に
  # インタプリタ（sh）経由で起動する。
  - actions:
      - type: command
        command: sh $HOME/.claude/hooks/herdr/herdr-agent-state.sh session
        use_stdin: true

SessionEnd:
