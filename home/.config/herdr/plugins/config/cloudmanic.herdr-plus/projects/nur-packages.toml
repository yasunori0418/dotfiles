name = "nur-packages"
description = "自作 Nix パッケージ（NUR）"
group = "yasunori0418"
working_dir = "~/src/github.com/yasunori0418/nur-packages"

[[tabs]]
name = "shell"

# Linux のみ Remote Control を有効化（macOS は素の claude）
[[tabs]]
name = "claude"
command = 'if [ "$(uname)" = Linux ]; then claude --remote-control nur-packages; else claude; fi'
