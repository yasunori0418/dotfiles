name = "dotfiles"
description = "Nix dotfiles (NixOS / nix-darwin / home-manager)"
group = "yasunori0418"
working_dir = "~/dotfiles"

[[tabs]]
name = "shell"

# Linux のみ Remote Control を有効化（macOS は素の claude）
[[tabs]]
name = "claude"
command = 'if [ "$(uname)" = Linux ]; then claude --remote-control dotfiles; else claude; fi'
